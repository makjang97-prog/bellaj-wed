<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>신청 리스트 | 벨라제이웨딩</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body>

<!-- 로그인 -->
<section class="gate" id="gate">
  <div class="gate-inner">
    <p class="gate-brand">BELLAJ WEDDING</p>
    <h1 class="gate-title">신청 리스트</h1>
    <p class="gate-desc">관리자 PIN 번호를 입력해 주세요.</p>
    <form id="pinForm" class="pin-form" autocomplete="off">
      <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="관리자 PIN">
      <button type="submit" class="gate-btn">들어가기</button>
    </form>
    <p class="gate-err" id="gateErr" hidden></p>
    <p class="gate-note">이 화면은 검색에 노출되지 않습니다.</p>
  </div>
</section>

<!-- 리스트 -->
<div class="app" id="app" hidden>
  <header class="app-head">
    <div class="app-head-top">
      <div>
        <p class="app-brand">BELLAJ WEDDING</p>
        <h1 class="app-title">사전예약 신청 리스트</h1>
      </div>
      <button class="link-btn" id="logoutBtn" type="button">로그아웃</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><span class="stat-num" data-stat="all">0</span><span class="stat-label">전체</span></div>
      <div class="stat"><span class="stat-num" data-stat="waiting">0</span><span class="stat-label">대기</span></div>
      <div class="stat"><span class="stat-num" data-stat="contacted">0</span><span class="stat-label">연락완료</span></div>
      <div class="stat"><span class="stat-num" data-stat="booked">0</span><span class="stat-label">예약확정</span></div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab is-on" data-filter="all" type="button">전체</button>
        <button class="tab" data-filter="waiting" type="button">대기</button>
        <button class="tab" data-filter="contacted" type="button">연락완료</button>
        <button class="tab" data-filter="booked" type="button">예약확정</button>
      </div>
      <button class="refresh" id="refreshBtn" type="button" aria-label="새로고침">새로고침</button>
    </div>
    <p class="updated" id="updated"></p>
  </header>

  <main class="list" id="list" aria-live="polite">
    <p class="empty">불러오는 중…</p>
  </main>

  <p class="app-foot">벨라제이웨딩 프라이빗 피팅 초대전 신청 관리 · <a href="/" target="_blank" rel="noopener">페이지 보기</a></p>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="/admin.js" defer></script>
</body>
</html>
